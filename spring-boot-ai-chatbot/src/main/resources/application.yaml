# Set GROQ_API_KEY in your environment (never commit the real key).
groq:
  api:
    key: ${GROQ_API_KEY:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: demo
  ai:
    openai:
      api-key: ${groq.api.key}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.7

logging:
  level:
    org.springframework.ai: INFO
    root: INFO
